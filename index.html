<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>포켓몬 포획 게임</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/neodgm/neodgm-webfont@latest/neodgm/style.css">
    <link rel="stylesheet" href="style.css">

    <!-- 고정 경로 정적 에셋 프리로드 (몬스터처럼 랜덤 선택되는 파일은 별도 JS 프리로드로 처리) -->
    <link rel="preload" as="image" href="images/pokemon/pokeball/1.png">
    <link rel="preload" as="image" href="images/pokemon/pokeball/throw.gif">
    <link rel="preload" as="image" href="images/pokemon/pokeball/catch.gif">
    <link rel="preload" as="image" href="images/pokemon/pokeball/open.gif">
    <link rel="preload" as="image" href="images/pokemon/layout/shiny.png">
    <link rel="preload" as="image" href="images/pokemon/layout/action_box.png">
    <link rel="preload" as="image" href="images/pokemon/layout/hp_bar.png">
    <link rel="preload" as="image" href="images/pokemon/layout/overlay_hp_back.png">
    <link rel="preload" as="image" href="images/pokemon/layout/overlay_hp.png">
    <link rel="preload" as="image" href="images/pokemon/layout/types.png">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body>

    <div id="game-frame">
    <div id="game-container">
        <!-- 메인 로그인 화면 -->
        <div id="login-screen" class="start-submenu">
            <img id="game-login-logo" src="images/pokemon/layout/logo.png" alt="Pokemon Masters">
            <button id="btn-show-student-login" class="menu-item">학생 로그인</button>
            <button id="btn-show-admin-login" class="menu-item">관리자 로그인</button>
        </div>

        <!-- 관리자 로그인 모달 -->
        <div id="admin-login-modal" class="mp-modal hidden">
            <div class="mp-box">
                <button id="admin-login-close-btn" class="quiz-close-btn">×</button>
                <div class="mp-title">관리자 로그인</div>
                <div style="display: flex; flex-direction: column; gap: 8px;">
                    <input type="password" id="admin-pw-input" class="dex-cheat-input" placeholder="비밀번호 입력" style="flex: none; width: 100%;">
                    <button id="btn-admin-login" class="dex-settings-action-btn" style="width: 100%;">확인</button>
                </div>
                <div id="admin-login-feedback" class="field-feedback"></div>
            </div>
        </div>

        <!-- 학생 로그인 모달 -->
        <div id="student-login-modal" class="mp-modal hidden">
            <div class="mp-box">
                <button id="student-login-close-btn" class="quiz-close-btn">×</button>
                <div class="mp-title">학생 로그인</div>
                <div style="display: flex; flex-direction: column; gap: 8px;">
                    <input type="text" id="student-id-input" class="dex-cheat-input" placeholder="아이디" autocomplete="off" style="flex: none; width: 100%;">
                    <input type="password" id="student-pw-input" class="dex-cheat-input" placeholder="비밀번호" style="flex: none; width: 100%;">
                    <button id="btn-student-login" class="dex-settings-action-btn" style="width: 100%;">로그인</button>
                </div>
                <div id="student-login-feedback" class="field-feedback"></div>
            </div>
        </div>

        <!-- 관리자 대시보드 화면 -->
        <div id="admin-dashboard-screen" class="start-submenu hidden">
            <button id="btn-admin-create-student" class="menu-item">학생 계정 생성</button>
            <button id="btn-admin-manage-students" class="menu-item">학생 계정 관리</button>
            <button id="btn-admin-upload-data" class="menu-item">학습 데이터 업로드</button>
            <button id="btn-admin-manage-data" class="menu-item">학습 데이터 관리</button>
            <button id="btn-admin-logout" class="menu-item">로그아웃</button>
        </div>

        <!-- 학생 계정 관리 창 (관리자용) — 학생 계정 생성 모달과 완전히 같은 방식(.mp-modal/.mp-box)의
             창으로 대시보드 위에 떠서 열림. ×로 닫으면 대시보드가 그대로 보임(뒤로가기 버튼 없음) -->
        <div id="admin-student-manage-modal" class="mp-modal hidden">
            <div class="mp-box">
                <button id="admin-student-manage-close-btn" class="quiz-close-btn">×</button>
                <div class="mp-title">학생 계정 관리</div>
                <div id="student-list-container" class="admin-list">
                    <!-- 학생 계정 목록이 동적으로 추가됨 -->
                </div>
            </div>
        </div>

        <!-- 학생 계정 생성 모달 (관리자용) -->
        <div id="admin-student-create-modal" class="mp-modal hidden">
            <div class="mp-box">
                <button id="admin-student-create-close-btn" class="quiz-close-btn">×</button>
                <div class="mp-title">학생 계정 생성</div>
                <div style="display: flex; flex-direction: column; gap: 8px;">
                    <input type="text" id="new-student-id" class="dex-cheat-input" placeholder="새 학생 아이디" autocomplete="off" style="flex: none; width: 100%;">
                    <input type="password" id="new-student-pw" class="dex-cheat-input" placeholder="새 학생 비밀번호" style="flex: none; width: 100%;">
                    <button id="btn-create-student-submit" class="dex-settings-action-btn" style="width: 100%;">생성하기</button>
                </div>
                <div id="admin-student-create-feedback" class="field-feedback"></div>
            </div>
        </div>

        <!-- 학습 데이터 업로드 창 (관리자용) — 학생 계정 생성 모달과 동일한 구성(입력칸을 세로로
             쌓고 버튼은 전체폭) -->
        <div id="admin-data-upload-modal" class="mp-modal hidden">
            <div class="mp-box">
                <button id="admin-data-upload-close-btn" class="quiz-close-btn">×</button>
                <div class="mp-title">학습 데이터 업로드</div>
                <input type="file" id="excel-input" accept=".xlsx,.xls" class="hidden">
                <div style="display: flex; flex-direction: column; gap: 8px;">
                    <input type="text" id="data-title-input" class="dex-cheat-input" placeholder="데이터 이름" style="flex: none; width: 100%;">
                    <button id="upload-btn" class="dex-settings-action-btn" style="width: 100%;">업로드</button>
                </div>
                <div id="data-upload-feedback" class="field-feedback"></div>
            </div>
        </div>

        <!-- 학습 데이터 관리 창 (관리자용) — 학생 계정 관리 모달과 동일한 구성(목록만) -->
        <div id="admin-data-manage-modal" class="mp-modal hidden">
            <div class="mp-box">
                <button id="admin-data-manage-close-btn" class="quiz-close-btn">×</button>
                <div class="mp-title">학습 데이터 관리</div>
                <div id="data-list-container" class="admin-list">
                    <!-- 데이터 목록이 동적으로 추가됨 -->
                </div>
            </div>
        </div>

        <!-- 학습 데이터 선택 모달 (학생용) -->
        <div id="student-data-select-modal" class="mp-modal hidden">
            <div class="mp-box">
                <button id="student-data-select-close-btn" class="quiz-close-btn">×</button>
                <div class="mp-title">학습 데이터 선택</div>
                <div id="student-data-list-container" class="admin-list">
                    <!-- 데이터 목록이 동적으로 추가됨 -->
                </div>
            </div>
        </div>

        <div id="start-screen" class="hidden">
            <img id="game-main-logo" src="images/pokemon/layout/logo.png" alt="Pokemon Masters">
            <button id="btn-select-learning-data" class="menu-item">학습 데이터 선택</button>
            <button id="start-btn" class="menu-item" disabled>포켓몬 포획</button>
            <button id="battle-btn" class="menu-item">포켓몬 배틀</button>
            <button id="dex-btn" class="menu-item">포켓몬 도감</button>
            <button id="btn-student-logout" class="menu-item">로그아웃</button>
        </div>

        <!-- "포켓몬 배틀"을 누르면 시작화면 대신 뜨는 하위 메뉴(시작화면과 같은 레이아웃) —
             혼자하기(AI 트레이너) / 함께하기(초대 코드로 1:1 대전, pokemon_multiplayer.js) -->
        <div id="battle-mode-menu" class="start-submenu hidden">
            <button id="battle-solo-btn" class="menu-item">혼자하기</button>
            <button id="battle-together-btn" class="menu-item">함께하기</button>
            <button id="battle-mode-back-btn" class="menu-item">뒤로가기</button>
        </div>
        <div id="battle-together-menu" class="start-submenu hidden">
            <button id="mp-create-btn" class="menu-item">초대 코드 생성하기</button>
            <button id="mp-join-btn" class="menu-item">초대 코드 입력</button>
            <button id="battle-together-back-btn" class="menu-item">뒤로가기</button>
        </div>

        <!-- 함께하기 대기실: 초대 코드를 만든 쪽(호스트)이 상대가 들어올 때까지 보는 창 — 퀴즈창과 같은 디자인.
             ×를 누르면 방을 닫음. 상대가 들어오면 바로 배틀 슬롯 선택창으로 넘어감 -->
        <div id="mp-lobby-modal" class="mp-modal hidden">
            <div class="mp-box">
                <button id="mp-lobby-close-btn" class="quiz-close-btn">×</button>
                <div class="mp-title">대기실</div>
                <div class="mp-label">초대 코드</div>
                <div id="mp-lobby-code" class="mp-code">------</div>
                <div id="mp-lobby-status" class="mp-status">코드를 생성하는 중<span class="mp-dots"></span></div>
            </div>
        </div>

        <!-- 함께하기 입장: 상대에게 받은 초대 코드를 입력하는 창 -->
        <div id="mp-join-modal" class="mp-modal hidden">
            <div class="mp-box">
                <button id="mp-join-close-btn" class="quiz-close-btn">×</button>
                <div class="mp-title">초대 코드 입력</div>
                <div class="mp-join-row">
                    <input type="text" id="mp-join-input" class="dex-cheat-input mp-join-input" placeholder="코드 6자리" maxlength="6" autocomplete="off" autocapitalize="characters" spellcheck="false">
                    <button id="mp-join-submit-btn" class="dex-settings-action-btn dex-cheat-apply-btn">입장</button>
                </div>
                <div id="mp-join-feedback" class="mp-feedback"></div>
            </div>
        </div>


        <div id="result-screen" class="hidden">
            <div id="result-stats">
                <div id="result-score">🏆 점수 : 0점</div>
                <div id="result-correct">⭕ 정답 : 0개</div>
                <div id="result-wrong">❌ 오답 : 0개</div>
            </div>
            <div id="result-actions">
                <button id="result-home-btn" class="menu-item">처음으로</button>
                <button id="retry-btn" class="menu-item">다시하기</button>
                <button id="captured-list-btn" class="menu-item">포획한 포켓몬</button>
                <button id="dex-btn-result" class="menu-item">포켓몬 도감</button>
            </div>
        </div>

        <!-- 배틀 뒷모습 프리뷰: 아직 실제 배틀 로직은 없고, 고른 포켓몬의 뒷모습을 포획 게임
             화면의 몬스터볼 위치에 보여주고, 야생 포켓몬(#monster 등 기존 요소 재사용)이
             캐치 게임과 동일하게 등장하는 것까지만 구현된 화면. 액션박스는 위치만 캐치 게임과
             맞춘 비활성 장식(기능은 추후 구현) -->
        <div id="battle-preview-screen" class="hidden">
            <button id="battle-preview-close-btn" class="quiz-close-btn">×</button>
            <div id="battle-back-sprite-box"><div id="battle-back-sprite"></div></div>
            <div id="battle-back-shiny-effect" class="hidden"></div>
            <!-- 내 포켓몬 쪽 랭크업(칼춤)/회복(HP회복) 이펙트 — 이로치 이펙트와 같은 방식. 내 hp바/이름표
                 (#battle-back-info, z-index 6)와 같은 층이라 그보다 아래에 그려짐. 상대 쪽은 #battle-foe-move-effect -->
            <div id="battle-move-effect" class="hidden"></div>
            <div id="battle-back-info"><div id="battle-back-hp-fill"></div></div>
            <div id="battle-back-info-text">
                <span id="battle-back-name"></span>
                <span id="battle-back-types" class="type-badges"></span>
            </div>
            <div id="battle-action-box">
                <div id="battle-main-menu">
                    <button id="battle-status-btn" class="menu-item">상태 확인</button>
                    <button id="battle-attack-btn" class="menu-item">싸운다</button>
                    <button id="battle-switch-btn" class="menu-item">포켓몬</button>
                </div>
                <!-- "싸운다"를 누르면 위 메뉴 대신 이게 보임 — 공격/랭크업/회복 3개 버튼을
                     renderBattleMoveMenu()(script.js)가 채워 넣음. 뒤로가기는 메인 메뉴로 복귀 -->
                <div id="battle-move-menu" class="hidden">
                    <button id="battle-move-back-btn" class="battle-move-back-btn" aria-label="뒤로가기"></button>
                    <div id="battle-move-list"></div>
                </div>
                <!-- "포켓몬"을 누르면(자진 교체) 또는 내 포켓몬이 기절해서 강제로
                     교체해야 할 때(강제 교체) 둘 다 위 메뉴 대신 이게 보임 — 지금 나가있지 않고
                     기절하지 않은 포켓몬의 이름만 버튼으로 보여주고, 누르면 바로 그 포켓몬으로
                     교체를 선택함(기술 메뉴와 동일한 방식). 예전엔 강제 교체만 별도 오버레이
                     (#battle-switch-menu)를 썼는데, 그 오버레이는 죽은 코드가 되어 완전히 삭제함 -->
                <div id="battle-switch-inline-menu" class="hidden">
                    <button id="battle-switch-inline-back-btn" class="battle-move-back-btn" aria-label="뒤로가기"></button>
                    <div id="battle-switch-inline-list"></div>
                </div>
                <!-- 공격 상호작용 중 액션박스가 대화창으로 전환될 때 쓰는 영역(포획 게임의
                     #capture-message와 동일한 방식 — showBattleMessage()가 typeMessage()로 채움) -->
                <div id="battle-message-box" class="hidden"></div>
            </div>

            <!-- "상태 확인" 버튼으로 여는 정보 전용 오버레이(퀴즈창 #quiz-modal과 같은 디자인) — 내/상대
                 포켓몬 슬롯 3칸씩과, 지금 나가있는 내 포켓몬 기준 상대 3마리와의 상성을 보여줌.
                 슬롯 칸은 배틀 선택 슬롯(.battle-slot)과 같은 구조라 createSlotSpriteController를 재사용함 -->
            <div id="battle-status-modal" class="hidden">
                <div id="battle-status-box">
                    <button id="battle-status-close-btn" class="quiz-close-btn">×</button>
                    <div class="battle-status-label">내 포켓몬</div>
                    <div id="battle-status-my-row" class="battle-status-row">
                        <div class="battle-status-cell"><div class="battle-slot empty"><div class="battle-slot-sprite-box"><div class="battle-slot-sprite"></div></div><span class="battle-slot-form-icon hidden"></span><div class="battle-status-namerow"><span class="bs-icon"></span><div class="battle-slot-name"></div></div><div class="battle-status-types type-badges"></div></div></div>
                        <div class="battle-status-cell"><div class="battle-slot empty"><div class="battle-slot-sprite-box"><div class="battle-slot-sprite"></div></div><span class="battle-slot-form-icon hidden"></span><div class="battle-status-namerow"><span class="bs-icon"></span><div class="battle-slot-name"></div></div><div class="battle-status-types type-badges"></div></div></div>
                        <div class="battle-status-cell"><div class="battle-slot empty"><div class="battle-slot-sprite-box"><div class="battle-slot-sprite"></div></div><span class="battle-slot-form-icon hidden"></span><div class="battle-status-namerow"><span class="bs-icon"></span><div class="battle-slot-name"></div></div><div class="battle-status-types type-badges"></div></div></div>
                    </div>
                    <div class="battle-status-label">상대 포켓몬</div>
                    <div id="battle-status-ai-row" class="battle-status-row">
                        <div class="battle-status-cell"><div class="battle-slot empty"><div class="battle-slot-sprite-box"><div class="battle-slot-sprite"></div></div><span class="battle-slot-form-icon hidden"></span><div class="battle-status-namerow"><span class="bs-icon"></span><div class="battle-slot-name"></div></div><div class="battle-status-types type-badges"></div></div></div>
                        <div class="battle-status-cell"><div class="battle-slot empty"><div class="battle-slot-sprite-box"><div class="battle-slot-sprite"></div></div><span class="battle-slot-form-icon hidden"></span><div class="battle-status-namerow"><span class="bs-icon"></span><div class="battle-slot-name"></div></div><div class="battle-status-types type-badges"></div></div></div>
                        <div class="battle-status-cell"><div class="battle-slot empty"><div class="battle-slot-sprite-box"><div class="battle-slot-sprite"></div></div><span class="battle-slot-form-icon hidden"></span><div class="battle-status-namerow"><span class="bs-icon"></span><div class="battle-slot-name"></div></div><div class="battle-status-types type-badges"></div></div></div>
                    </div>
                </div>
            </div>

            <div id="battle-result-overlay" class="hidden">
                <!-- 배틀 쪽은 아직 학습 데이터 연계 통계(점수/정답/오답) 시스템이 없어서
                     비워두고 hidden 처리 — 승패 소식은 이 화면이 뜨기 직전 액션박스 멘트
                     ("상대와의 승부에서 이겼다!"/"졌다!")로 이미 전달됨. 나중에 배틀에도 통계
                     기능이 붙으면(포획 게임의 #result-stats처럼) 이 자리에 다시 채워 넣을 것 -->
                <div id="battle-result-text" class="hidden"></div>
                <!-- 포획 게임 결과 화면(#result-actions)과 동일하게 "처음으로"/
                     "다시하기" 버튼을 함께 보여줌 -->
                <div id="battle-result-actions">
                    <button id="battle-result-home-btn" class="menu-item">처음으로</button>
                    <button id="battle-result-retry-btn" class="menu-item">다시하기</button>
                </div>
            </div>
        </div>

        <div id="pause-modal" class="hidden">
            <button class="menu-item" onclick="resumeFromPause()">계속하기</button>
            <button class="menu-item" onclick="quitFromPause()">그만하기</button>
        </div>

        <div id="quiz-modal" class="hidden">
            <div id="quiz-box">
                <button id="quiz-close-btn" class="quiz-close-btn">×</button>
                <div id="quiz-question"></div>
                <div id="quiz-options"></div>
                <div id="quiz-feedback"></div>
            </div>
        </div>

        <div id="captured-modal" class="hidden">
            <div id="captured-box">
                <button id="captured-close-btn" class="quiz-close-btn">×</button>
                <div id="captured-title">포획한 포켓몬</div>
                <div id="captured-list"></div>
            </div>
        </div>

        <!-- 포켓몬 도감: "포획한 포켓몬" 목록 창(#captured-modal)과 동일한 디자인(흰 바탕 + 검정 테두리)으로 통일.
             "포켓몬 배틀" 버튼으로 열렸을 때는 dexPickerMode 플래그로 선택 모드가 되어, #dex-core 아래에
             배틀 슬롯 바(#dex-battle-slot-row/#dex-battle-decide-btn)가 추가로 나타남. 폼 그리드 칸을
             클릭하는 것 자체가 미리보기 + 슬롯 등록/해제를 겸함(별도 추가/빼기 버튼 없음) -->
        <div id="dex-modal" class="hidden">
            <div id="dex-box">
                <!-- 도감 본문 전체(헤더~치트 페이지)를 감싸는 래퍼 — 일반 도감 모드일 때의 #dex-box
                     콘텐츠 영역과 정확히 같은 고정 높이를 가져서, 배틀 선택 모드에서 슬롯 바가 이
                     영역을 줄이지 않고 #dex-box 자체가 그만큼 더 길어지게 함(style.css #dex-core 참고) -->
                <div id="dex-core">
                <div id="dex-header">
                    <!-- 좌측 상단 자리: 목록 화면에서는 설정 버튼, 정보/설정 화면에서는 뒤로가기 버튼 —
                         두 버튼이 같은 위치를 번갈아 차지함(둘 다 절대배치, 동시에 보이지 않음) -->
                    <button id="dex-back-btn" class="dex-back-btn hidden">‹</button>
                    <button id="dex-settings-btn" class="dex-settings-btn">⚙</button>
                    <input type="text" id="dex-search-input" class="dex-search-input" placeholder="이름 또는 번호 검색" autocomplete="off">
                    <button id="dex-close-btn" class="quiz-close-btn">×</button>
                </div>
                <div id="dex-count-bar">
                    <label id="dex-owned-only-label" class="dex-owned-only-label">
                        <input type="checkbox" id="dex-owned-only-checkbox">
                        <span>잡음</span>
                    </label>
                    <div id="dex-count-text"><span id="dex-caught-count">0</span> / <span id="dex-total-count">0</span></div>
                </div>

                <div id="dex-list"></div>

                <!-- 포켓몬 정보 화면: 도감 목록에서 포켓몬을 누르면(포획 여부 상관없이) 목록 대신 이 화면이 표시됨 -->
                <div id="dex-info" class="hidden">
                    <div id="dex-info-num"></div>
                    <div id="dex-info-name-row">
                        <span id="dex-info-name"></span>
                    </div>
                    <div id="dex-info-sprite-card">
                        <div id="dex-info-sprite-box"><div id="dex-info-sprite"></div></div>
                    </div>
                    <!-- 폼 그리드: 이 종에 속한 대표폼을 포함한 모든 폼(리전/성별/코스튬/그림자 등
                         일반폼 + 메가진화 + 거다이맥스)을 한 줄에 3칸씩 정리. 모든 칸은 정지 아이콘만
                         표시(잡은 폼은 컬러, 못 잡은 폼은 실루엣). 칸을 클릭하면 위 큰 카드가 해당
                         폼의 움직이는 스프라이트로 전환됨(renderDexFormGrid / showDexInfoForm) —
                         배틀 선택 모드(dexPickerMode)에서는 같은 클릭이 슬롯 등록/해제도 겸함(이미
                         슬롯에 있는 폼은 .in-party 체크 배지로 표시, markDexFormGridPartyCells 참고) -->
                    <div id="dex-info-form-grid" class="hidden"></div>
                </div>

                <!-- 설정 화면: 좌측 상단 설정(⚙) 버튼을 누르면 목록 대신 표시됨. 버튼 두 개만
                     있고, 각각을 누르면 아래의 전용 페이지(#dex-reset-page / #dex-cheat-page)로
                     "이동"함(토글로 펼치는 방식이 아니라 완전히 별도 화면 전환) -->
                <div id="dex-settings" class="hidden">
                    <div id="dex-settings-title">설정</div>
                    <button id="dex-reset-btn" class="dex-settings-action-btn">도감 초기화</button>
                    <button id="dex-cheat-btn" class="dex-settings-action-btn">치트 코드</button>
                </div>

                <!-- 도감 초기화 페이지: 설정 화면에서 "도감 초기화" 버튼을 누르면 전환됨(뒤로가기를
                     누르면 설정 화면으로 복귀). 되돌릴 수 없는 파괴적 동작이라 정확한 코드(DeleteAll)를
                     입력해야만 초기화 버튼이 실제로 동작하는 안전장치를 둠(applyDexReset 참고) -->
                <div id="dex-reset-page" class="hidden">
                    <div id="dex-reset-page-title">도감 초기화</div>
                    <div id="dex-reset-row">
                        <input type="text" id="dex-reset-input" class="dex-cheat-input" placeholder="초기화 코드 입력" autocomplete="off">
                        <button id="dex-reset-apply-btn" class="dex-settings-action-btn dex-cheat-apply-btn dex-danger">초기화</button>
                    </div>
                    <div id="dex-reset-feedback"></div>
                </div>

                <!-- 치트 코드 페이지: 설정 화면에서 "치트 코드" 버튼을 누르면 전환됨(뒤로가기를
                     누르면 설정 화면으로 복귀). 실제 포획 데이터는 건드리지 않고 화면 표시만 바꾸는
                     개발/테스트용 기능. DexAll = 전부 언락(이름 공개)되지만 실제로 안 잡은 건 흑백,
                     CaughtAll = 전부 실제로 잡은 것처럼 컬러 표시 -->
                <div id="dex-cheat-page" class="hidden">
                    <div id="dex-cheat-page-title">치트 코드</div>
                    <div id="dex-cheat-row">
                        <input type="text" id="dex-cheat-input" class="dex-cheat-input" placeholder="치트 코드 입력" autocomplete="off">
                        <button id="dex-cheat-apply-btn" class="dex-settings-action-btn dex-cheat-apply-btn">적용하기</button>
                    </div>
                    <div id="dex-cheat-feedback"></div>
                </div>
                </div><!-- /#dex-core -->

                <!-- 배틀 슬롯 바 — dexPickerMode일 때만 보임(updateDexPickerBarVisibility). 목록/정보
                     화면 어느 쪽에 있든 하단에 고정으로 붙어있고, 설정/초기화/치트 페이지에서는 숨김.
                     슬롯 칸 디자인(.battle-slot 등)은 실제 앞모습 애니메이션을 재생함(renderBattleSlotSprite) -->
                <div id="dex-battle-slot-row" class="hidden">
                    <div class="battle-slot empty" data-slot="0">
                        <div class="battle-slot-sprite-box"><div class="battle-slot-sprite"></div></div>
                        <span class="battle-slot-form-icon hidden"></span>
                        <div class="battle-slot-name"></div>
                        <div class="battle-status-types type-badges"></div>
                    </div>
                    <div class="battle-slot empty" data-slot="1">
                        <div class="battle-slot-sprite-box"><div class="battle-slot-sprite"></div></div>
                        <span class="battle-slot-form-icon hidden"></span>
                        <div class="battle-slot-name"></div>
                        <div class="battle-status-types type-badges"></div>
                    </div>
                    <div class="battle-slot empty" data-slot="2">
                        <div class="battle-slot-sprite-box"><div class="battle-slot-sprite"></div></div>
                        <span class="battle-slot-form-icon hidden"></span>
                        <div class="battle-slot-name"></div>
                        <div class="battle-status-types type-badges"></div>
                    </div>
                </div>
                <div id="dex-battle-action-row">
                    <button id="dex-battle-random-btn" class="menu-item">랜덤 선택</button>
                    <button id="dex-battle-decide-btn" class="menu-item" disabled>선택 완료</button>
                </div>
            </div>
        </div>

        <div id="monster-info" class="hidden"><div id="monster-hp-fill" class="hidden"></div></div>
        <div id="monster-info-text" class="hidden">
            <!-- 지금 등장한 몬스터를 "정확히 이 폼(+ 이로치 여부까지 일치)"으로 예전에 잡아본
                 적이 있으면 이름 앞에 표시되는 포획 완료 아이콘 (updateMonsterInfo 참고) -->
            <span id="monster-owned-badge" class="dex-owned-badge hidden"></span>
            <span id="monster-name"></span>
            <span id="monster-bst"></span>
            <!-- 배틀 프리뷰에서만 #monster-bst(CP) 대신 표시되는 타입 뱃지 한 줄(1~2개) -->
            <span id="monster-types" class="type-badges hidden"></span>
        </div>
        <button id="game-timer" class="hidden" type="button">05:00</button>
        <button id="cp-total" class="hidden" type="button">0.0k</button>

        <div id="monster" class="hidden"><div id="monster-sprite"></div></div>
        <div id="shiny-effect" class="hidden"></div>
        <!-- 상대 포켓몬 쪽 랭크업(칼춤)/회복(HP회복) 이펙트 — #shiny-effect와 같은 층(게임 컨테이너)에 둬서
             상대 hp바/이름표(#monster-info, z-index 6)보다 아래에 그려지게 함(본가·원작처럼 HP 표시가 이펙트 위) -->
        <div id="battle-foe-move-effect" class="hidden"></div>
        <img id="pokeball" class="hidden" src="images/pokemon/pokeball/1.png" alt="포켓볼">

        <div id="control-panel" class="hidden">
            <div id="action-btns">
                <button id="charge-btn"  class="menu-item">충전하기</button>
                <button id="throw-btn"   class="menu-item">몬스터볼×1</button>
                <button id="runaway-btn" class="menu-item">도망치다×1</button>
                <div id="capture-message" class="hidden"></div>
            </div>
        </div>
    </div>
    </div>

    <script type="module" src="firebase_config.js"></script>
    <script type="module" src="auth_manager.js"></script>
    <script src="pokemon_data.js"></script>
    <script src="pokemon_battle_data.js"></script>
    <script src="pokemon_front_sprite_offsets_data.js"></script>
    <script src="pokemon_back_sprite_offsets_data.js"></script>
    <script src="pokemon_pokedex_form_data.js"></script>
    <script src="script.js"></script>
    <script src="pokemon_learning.js"></script>
    <script src="pokemon_pokedex.js"></script>
    <script src="pokemon_catch.js"></script>
    <script src="pokemon_multiplayer.js"></script>
    <script src="pokemon_battle.js"></script>
</body>
</html>
